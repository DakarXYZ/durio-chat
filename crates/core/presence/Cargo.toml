[package]
name = "revolt-presence"
version = "0.16.0+fork.6"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["izzy <me@insrt.uk>"]
description = "dur.io backend: User Presence"
repository = "https://github.com/DakarXYZ/durio-chat"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
redis-is-patched = []

[dev-dependencies]
# Async
tokio = { workspace = true }

# Config for loading Redis URI
revolt-config = { workspace = true }

[dependencies]
# Utility
log = { workspace = true }
rand = { workspace = true }
once_cell = { workspace = true }

# Redis
redis-kiss = { workspace = true, default-features = false, features = [
    "tokio-runtime",
] }
