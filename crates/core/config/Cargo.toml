[package]
name = "revolt-config"
version = "0.16.0+fork.6"
edition = "2024"
license = "MIT"
authors = ["izzy <me@insrt.uk>"]
description = "dur.io backend: Configuration"
repository = "https://github.com/DakarXYZ/durio-chat"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
anyhow = ["dep:sentry-anyhow"]
report-macros = ["revolt-result"]
sentry = ["dep:sentry"]
test = ["tokio"]
default = ["sentry"]

[dependencies]
# Utility
config = { workspace = true }
cached = { workspace = true }

# Serde
serde = { workspace = true }

# Async
futures-locks = { workspace = true }
tokio = { workspace = true, optional = true }

# Logging
log = { workspace = true }
pretty_env_logger = { workspace = true }

# Sentry
sentry = { workspace = true, optional = true }
sentry-anyhow = { workspace = true, optional = true }

# Core
revolt-result = { workspace = true, optional = true }
