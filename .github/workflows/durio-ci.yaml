name: durio ci

# Build and test on GitHub-hosted runners (upstream rust.yaml needs their self-hosted runners
# and pushes OpenAPI to their repo, so it is guarded to stoatchat only).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: durio-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust project
    if: github.repository_owner != 'stoatchat'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dav1d
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdav1d-dev pkg-config

          if ! pkg-config --atleast-version=1.3.0 dav1d; then
            echo "The runner's dav1d is older than 1.3, will install build tools"
            sudo apt-get install --yes meson ninja-build nasm
          fi

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@cd24790a7f5f6439ac32cc94f5523cb2de8bfa8c # use-mise-action-v1.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: mise check
      - run: mise build
      - run: mise docker:start

      - name: Reference Test
        env:
          TEST_DB: REFERENCE
        run: mise test

      - name: MongoDB Test
        env:
          TEST_DB: MONGODB
          MONGODB: mongodb://localhost
        run: mise test
