# Minimal stack to check that a freshly built api image starts and reports our version.
# Used by .github/workflows/durio-images.yaml and scripts/durio/build-images.sh --smoke.
name: durio-smoke

services:
  database:
    # MongoDB 8 does not start on Linux 6.19+ (SERVER-121912), which the GitHub runners now have; 7.0 does
    image: docker.io/mongo:7.0.45
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  redis:
    image: docker.io/valkey/valkey:9-alpine

  rabbit:
    image: docker.io/rabbitmq:4
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpass
    healthcheck:
      # root CLI before the server is up would create ~/.erlang.cookie owned by root and the
      # broker dies on eacces (and again on every restart, the file stays in the volume):
      # ask only once the server has written its cookie
      test: ["CMD-SHELL", "test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q ping"]
      interval: 5s
      retries: 30

  api:
    image: ${DURIO_API_IMAGE:?set DURIO_API_IMAGE}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    ports:
      - "127.0.0.1:14702:14702"
